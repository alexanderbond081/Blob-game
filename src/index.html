<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title><%= htmlWebpackPlugin.options.title %></title>
	<% for (const script of htmlWebpackPlugin.options.platformSdkScripts || []) { %>
	<script src="<%= script.src %>"></script>
	<% } %>
	<style>
		html, body, canvas, #game-container {
			touch-action: none;
			-webkit-touch-callout: none;
			-webkit-user-select: none;
			user-select: none;
			overflow: hidden;
		}

		html, body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			background: #222222;
			-webkit-tap-highlight-color: transparent;
		}

		#game-container {
			position: relative;
			width: 100%;
			height: 100%;
		}

		canvas {
			display: block;
			width: 100%;
			height: 100%;
			-webkit-tap-highlight-color: transparent;
		}
	</style>
</head>
<body>
	<div id="game-container"></div>
</body>
</html>
